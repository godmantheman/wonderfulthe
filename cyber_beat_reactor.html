<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>사이버 비트: 네온 리액터 (Cyber Beat: Neon Reactor)</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060510;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    touch-action: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at 50% 20%, #151030 0%, #060510 75%);
    box-shadow: 0 0 60px rgba(0, 240, 255, 0.08);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* Overlay Screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(6, 5, 16, 0.88);
    backdrop-filter: blur(10px);
    z-index: 20;
    overflow-y: auto;
  }
  .hidden {
    display: none !important;
  }

  .logo-badge {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #00f0ff;
    border: 1px solid rgba(0, 240, 255, 0.4);
    background: rgba(0, 240, 255, 0.08);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  h1.title {
    font-size: 28px;
    font-weight: 900;
    text-align: center;
    line-height: 1.2;
    background: linear-gradient(135deg, #00f0ff 0%, #ff007b 55%, #ffbe0b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 13px;
    color: #94a3b8;
    text-align: center;
    margin-bottom: 18px;
    line-height: 1.45;
  }

  .section-label {
    width: 100%;
    max-width: 420px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #64748b;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .track-list {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .track-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(20, 18, 42, 0.85);
    border: 1.5px solid rgba(148, 163, 184, 0.2);
    cursor: pointer;
    transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s;
  }
  .track-card:active {
    transform: scale(0.98);
  }
  .track-card.selected {
    border-color: #00f0ff;
    background: rgba(0, 240, 255, 0.1);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
  }
  .track-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .track-name {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
  }
  .track-meta {
    font-size: 12px;
    color: #94a3b8;
  }
  .track-best {
    text-align: right;
    font-size: 12px;
    color: #cbd5e1;
  }
  .track-rank {
    font-size: 18px;
    font-weight: 900;
    color: #ffbe0b;
  }

  .diff-row {
    width: 100%;
    max-width: 420px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .diff-btn {
    padding: 10px;
    border-radius: 12px;
    border: 1.5px solid rgba(148, 163, 184, 0.25);
    background: rgba(20, 18, 42, 0.75);
    color: #cbd5e1;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .diff-btn.active-normal {
    border-color: #00f0ff;
    color: #00f0ff;
    background: rgba(0, 240, 255, 0.12);
  }
  .diff-btn.active-overdrive {
    border-color: #ff007b;
    color: #ff4da6;
    background: rgba(255, 0, 123, 0.14);
  }

  .setting-row {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(15, 14, 32, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.16);
    margin-bottom: 18px;
    font-size: 12px;
    color: #cbd5e1;
  }
  .setting-row input[type="range"] {
    flex: 1;
    accent-color: #00f0ff;
  }

  .primary-btn {
    width: 100%;
    max-width: 420px;
    padding: 15px 20px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #00f0ff, #ff007b);
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(255, 0, 123, 0.35);
    transition: transform 0.12s;
  }
  .primary-btn:active {
    transform: scale(0.97);
  }
  .secondary-btn {
    padding: 11px 18px;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    background: rgba(30, 27, 60, 0.8);
    color: #e2e8f0;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .controls-hint {
    margin-top: 14px;
    font-size: 12px;
    color: #64748b;
    text-align: center;
    line-height: 1.5;
  }

  /* Top HUD Controls */
  .hud-bar {
    position: absolute;
    top: 8px;
    right: 10px;
    display: flex;
    gap: 6px;
    z-index: 15;
  }
  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(12, 10, 26, 0.72);
    color: #e2e8f0;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }

  /* Result Card */
  .result-card {
    width: 100%;
    max-width: 400px;
    background: rgba(18, 16, 38, 0.95);
    border: 1.5px solid rgba(0, 240, 255, 0.35);
    border-radius: 20px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6);
  }
  .result-rank {
    font-size: 62px;
    font-weight: 900;
    line-height: 1;
    margin: 6px 0 4px;
    background: linear-gradient(135deg, #ffbe0b, #ff007b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .result-score {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 4px;
  }
  .new-record {
    display: inline-block;
    font-size: 11px;
    font-weight: 900;
    background: linear-gradient(135deg, #ffbe0b, #ff007b);
    color: #fff;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 14px 0 18px;
    text-align: left;
  }
  .stat-box {
    background: rgba(255, 255, 255, 0.04);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    color: #94a3b8;
  }
  .stat-box strong {
    display: block;
    font-size: 15px;
    color: #f8fafc;
    margin-top: 2px;
  }
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>

  <div id="hudControls" class="hud-bar hidden">
    <button id="muteBtn" class="icon-btn" title="사운드 켜기/끄기">🔊</button>
    <button id="pauseBtn" class="icon-btn" title="일시정지">⏸</button>
  </div>

  <!-- Start / Song Select Screen -->
  <div id="menuOverlay" class="overlay">
    <div class="logo-badge">DAY 5 · RHYTHM BOSS ACTION</div>
    <h1 class="title">사이버 비트:<br>네온 리액터</h1>
    <p class="subtitle">비트 맞춰 노트를 터뜨리고 거대 사이버 보스를 격파하세요!</p>

    <div class="section-label">트랙 선택</div>
    <div id="trackList" class="track-list"></div>

    <div class="section-label">난이도</div>
    <div class="diff-row">
      <button id="diffNormal" class="diff-btn active-normal">⚡ NORMAL</button>
      <button id="diffOverdrive" class="diff-btn">🔥 OVERDRIVE</button>
    </div>

    <div class="setting-row">
      <span>싱크 보정 (블루투스용)</span>
      <input id="offsetSlider" type="range" min="-120" max="120" step="10" value="0">
      <span id="offsetVal" style="min-width:48px; text-align:right; font-weight:800; color:#00f0ff;">0ms</span>
    </div>

    <button id="startBtn" class="primary-btn">▶ 비트 스타트!</button>
    <div class="controls-hint">
      📱 모바일: 하단 4개 네온 레인을 직접 터치 (멀티터치 지원)<br>
      💻 PC: <b>D · F · J · K</b> 또는 <b>← · ↓ · ↑ · →</b>
    </div>
  </div>

  <!-- Pause Overlay -->
  <div id="pauseOverlay" class="overlay hidden">
    <h2 style="font-size:24px; font-weight:900; margin-bottom:16px;">일시정지</h2>
    <div style="display:flex; flex-direction:column; gap:10px; width:100%; max-width:260px;">
      <button id="resumeBtn" class="primary-btn">▶ 계속하기</button>
      <button id="restartBtn" class="secondary-btn">🔄 처음부터 다시</button>
      <button id="quitBtn" class="secondary-btn">🎵 트랙 선택으로</button>
    </div>
  </div>

  <!-- Result Overlay -->
  <div id="resultOverlay" class="overlay hidden">
    <div class="result-card">
      <div id="resultTrackTitle" style="font-size:13px; font-weight:700; color:#94a3b8;"></div>
      <div id="resultRank" class="result-rank">S</div>
      <div id="resultScore" class="result-score">0</div>
      <div id="newRecordBadge" class="new-record hidden">NEW BEST RECORD!</div>
      <div class="stats-grid">
        <div class="stat-box">정확도 <strong id="resAcc">0%</strong></div>
        <div class="stat-box">최대 콤보 <strong id="resCombo">0</strong></div>
        <div class="stat-box">격파한 보스 <strong id="resBosses">0기</strong></div>
        <div class="stat-box">판정 내역 <strong id="resBreakdown" style="font-size:11px;"></strong></div>
      </div>
      <div class="btn-row">
        <button id="resMenuBtn" class="secondary-btn">🎵 트랙 선택</button>
        <button id="resRetryBtn" class="primary-btn" style="padding:12px;">🔄 다시 플레이</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // DOM refs
  const menuOverlay = document.getElementById('menuOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const resultOverlay = document.getElementById('resultOverlay');
  const hudControls = document.getElementById('hudControls');
  const trackListEl = document.getElementById('trackList');
  const diffNormalBtn = document.getElementById('diffNormal');
  const diffOverdriveBtn = document.getElementById('diffOverdrive');
  const offsetSlider = document.getElementById('offsetSlider');
  const offsetVal = document.getElementById('offsetVal');
  const startBtn = document.getElementById('startBtn');
  const muteBtn = document.getElementById('muteBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resumeBtn = document.getElementById('resumeBtn');
  const restartBtn = document.getElementById('restartBtn');
  const quitBtn = document.getElementById('quitBtn');
  const resMenuBtn = document.getElementById('resMenuBtn');
  const resRetryBtn = document.getElementById('resRetryBtn');

  // Constants
  const LANE_COLORS = ['#00f0ff', '#ff007b', '#a855f7', '#ffbe0b'];
  const LANE_KEYS = ['D', 'F', 'J', 'K'];
  const KEY_MAP = {
    'KeyD': 0, 'ArrowLeft': 0, 'Digit1': 0,
    'KeyF': 1, 'ArrowDown': 1, 'Digit2': 1,
    'KeyJ': 2, 'ArrowUp': 2, 'Digit3': 2,
    'KeyK': 3, 'ArrowRight': 3, 'Digit4': 3
  };

  const BOSS_NAMES = [
    'SENTINEL-01',
    'NEON HYDRA',
    'PRISM TITAN',
    'VOID VALKYRIE',
    'OMEGA REACTOR'
  ];

  // Musical Track Definitions (16-bar synthwave loops, ~75s each)
  const TRACKS = [
    {
      id: 'neon_dawn',
      name: 'NEON DAWN',
      genre: 'Synthwave Groove',
      bpm: 112,
      bars: 36,
      scrollSpeed: 540,
      chords: [
        [220.0, 261.63, 329.63], // Am
        [174.61, 220.0, 261.63], // F
        [130.81, 196.0, 261.63], // C
        [196.0, 246.94, 293.66]  // G
      ],
      bassRoots: [110.0, 87.31, 130.81, 98.0],
      arpPattern: [0, 1, 2, 1, 2, 1, 0, 2]
    },
    {
      id: 'cyber_rush',
      name: 'CYBER RUSH',
      genre: 'Electro Pop',
      bpm: 128,
      bars: 40,
      scrollSpeed: 620,
      chords: [
        [146.83, 174.61, 220.0], // Dm
        [116.54, 174.61, 233.08], // Bb
        [130.81, 196.0, 261.63], // C
        [110.0, 164.81, 220.0]   // Am
      ],
      bassRoots: [73.42, 116.54, 130.81, 110.0],
      arpPattern: [0, 2, 1, 2, 0, 1, 2, 0]
    },
    {
      id: 'hyper_reactor',
      name: 'HYPER REACTOR',
      genre: 'Future Hardcore',
      bpm: 146,
      bars: 44,
      scrollSpeed: 710,
      chords: [
        [164.81, 196.0, 246.94], // Em
        [130.81, 196.0, 261.63], // C
        [146.83, 220.0, 293.66], // D
        [123.47, 185.0, 246.94]  // Bm
      ],
      bassRoots: [82.41, 130.81, 146.83, 123.47],
      arpPattern: [2, 1, 0, 2, 1, 2, 0, 1]
    }
  ];

  // App State
  let selectedTrackIdx = 0;
  let difficulty = 'normal'; // 'normal' | 'overdrive'
  let audioOffsetMs = Number(localStorage.getItem('cbr_offset_ms') || 0);
  let muted = false;

  offsetSlider.value = audioOffsetMs;
  offsetVal.textContent = (audioOffsetMs > 0 ? '+' : '') + audioOffsetMs + 'ms';

  // Canvas Geometry
  let W = 0, H = 0, dpr = 1;
  let arenaH = 0, hitY = 0, laneW = 0, laneLeft = 0;

  // Audio Engine
  let audioCtx = null;
  let masterGain = null;
  let noiseBuffer = null;
  let schedulerTimer = null;
  let nextStepTime = 0;
  let currentStep = 0;
  let songStartTime = 0;
  let totalSteps = 0;
  let stepDuration = 0;
  let pauseStartTime = 0;
  let pausedAccum = 0;

  // Game State
  let gameState = 'menu'; // 'menu' | 'playing' | 'paused' | 'result'
  let notes = [];
  let lanePressed = [false, false, false, false];
  let activeTouches = new Map(); // touchId -> lane
  let laneFlash = [0, 0, 0, 0];
  let particles = [];
  let lasers = [];
  let floatingTexts = [];
  let shakeAmount = 0;
  let beatPulse = 0;

  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let counts = { perfect: 0, great: 0, good: 0, miss: 0 };
  let bossLevel = 1;
  let bossHP = 100;
  let bossMaxHP = 100;
  let bossHitFlash = 0;
  let bossBreakTimer = 0;
  let songEndTime = 0;
  let rafId = null;

  // Seeded PRNG for deterministic charts
  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function resize() {
    const rect = document.getElementById('app').getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    arenaH = Math.max(150, Math.min(220, H * 0.25));
    hitY = H * 0.82;
    const playW = Math.min(W - 20, 440);
    laneW = playW / 4;
    laneLeft = (W - playW) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // Storage helpers
  function getBestKey(trackId, diff) {
    return `cbr_best_${trackId}_${diff}`;
  }
  function loadBest(trackId, diff) {
    try {
      const raw = localStorage.getItem(getBestKey(trackId, diff));
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  function saveBest(trackId, diff, data) {
    try {
      localStorage.setItem(getBestKey(trackId, diff), JSON.stringify(data));
    } catch {}
  }

  function renderTrackList() {
    trackListEl.innerHTML = '';
    TRACKS.forEach((tr, idx) => {
      const best = loadBest(tr.id, difficulty);
      const card = document.createElement('div');
      card.className = 'track-card' + (idx === selectedTrackIdx ? ' selected' : '');
      card.innerHTML = `
        <div class="track-info">
          <div class="track-name">${tr.name}</div>
          <div class="track-meta">${tr.bpm} BPM · ${tr.genre}</div>
        </div>
        <div class="track-best">
          ${best ? `<div class="track-rank">${best.rank}</div><div>${best.score.toLocaleString()}</div>` : '<div style="color:#64748b;">미도전</div>'}
        </div>
      `;
      card.onclick = () => {
        selectedTrackIdx = idx;
        renderTrackList();
      };
      trackListEl.appendChild(card);
    });
  }
  renderTrackList();

  diffNormalBtn.onclick = () => {
    difficulty = 'normal';
    diffNormalBtn.className = 'diff-btn active-normal';
    diffOverdriveBtn.className = 'diff-btn';
    renderTrackList();
  };
  diffOverdriveBtn.onclick = () => {
    difficulty = 'overdrive';
    diffNormalBtn.className = 'diff-btn';
    diffOverdriveBtn.className = 'diff-btn active-overdrive';
    renderTrackList();
  };

  offsetSlider.oninput = () => {
    audioOffsetMs = Number(offsetSlider.value);
    offsetVal.textContent = (audioOffsetMs > 0 ? '+' : '') + audioOffsetMs + 'ms';
    localStorage.setItem('cbr_offset_ms', String(audioOffsetMs));
  };

  // Web Audio Synthesizer
  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 0.72;
      masterGain.connect(audioCtx.destination);

      // White noise buffer for snare/hi-hat
      const bufSize = audioCtx.sampleRate * 0.5;
      noiseBuffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const out = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) out[i] = Math.random() * 2 - 1;
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playKick(time) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(145, time);
    osc.frequency.exponentialRampToValueAtTime(42, time + 0.14);
    g.gain.setValueAtTime(0.75, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(time);
    osc.stop(time + 0.23);
  }

  function playSnare(time) {
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(900, time);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.32, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.16);
    src.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    src.start(time);
    src.stop(time + 0.17);

    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(190, time);
    osc.frequency.exponentialRampToValueAtTime(95, time + 0.08);
    og.gain.setValueAtTime(0.28, time);
    og.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
    osc.connect(og);
    og.connect(masterGain);
    osc.start(time);
    osc.stop(time + 0.11);
  }

  function playHat(time, open = false) {
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(6500, time);
    const g = audioCtx.createGain();
    const dur = open ? 0.12 : 0.045;
    g.gain.setValueAtTime(open ? 0.14 : 0.09, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    src.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    src.start(time);
    src.stop(time + dur + 0.01);
  }

  function playBass(time, freq, dur) {
    const osc = audioCtx.createOscillator();
    const filter = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, time);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(620, time);
    filter.frequency.exponentialRampToValueAtTime(180, time + dur);
    g.gain.setValueAtTime(0.24, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    osc.start(time);
    osc.stop(time + dur + 0.01);
  }

  function playLead(time, freq, dur, vol = 0.12) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    g.gain.setValueAtTime(0.001, time);
    g.gain.linearRampToValueAtTime(vol, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(time);
    osc.stop(time + dur + 0.01);
  }

  function playHitSFX(quality, lane) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime;
    const freqs = [523.25, 587.33, 659.25, 783.99];
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = quality === 'perfect' ? 'sine' : 'triangle';
    const base = freqs[lane] * (quality === 'perfect' ? 2 : 1.5);
    osc.frequency.setValueAtTime(base, now);
    osc.frequency.exponentialRampToValueAtTime(base * 1.18, now + 0.05);
    g.gain.setValueAtTime(quality === 'perfect' ? 0.14 : 0.09, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.08);
  }

  function playBossBreakSFX() {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime;
    [261.63, 329.63, 392.0, 523.25, 659.25].forEach((f, idx) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sawtooth';
      const t = now + idx * 0.045;
      osc.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.26);
    });
  }

  // Generate Chart aligned to steps (16th notes)
  function buildChart(track, diff, startTime) {
    const rand = mulberry32(track.bpm * 100 + (diff === 'overdrive' ? 999 : 1));
    stepDuration = (60 / track.bpm) / 4; // 16th note
    totalSteps = track.bars * 16;
    const leadInSteps = 16; // 1 bar intro before first note
    const generated = [];

    let lastLane = -1;
    let holdCooldown = 0;

    for (let s = leadInSteps; s < totalSteps - 8; s++) {
      const bar = Math.floor(s / 16);
      const stepInBar = s % 16;
      const intensity = bar < 4 ? 0.45 : (bar > track.bars - 6 ? 0.95 : 0.78);

      if (holdCooldown > 0) {
        holdCooldown--;
        continue;
      }

      let spawn = false;
      let allowChord = false;
      let isHold = false;

      if (diff === 'normal') {
        if (stepInBar % 4 === 0) spawn = rand() < 0.88 * intensity + 0.1;
        else if (stepInBar % 2 === 0) spawn = rand() < 0.36 * intensity;
        if (bar >= 8 && stepInBar === 0 && rand() < 0.22) isHold = true;
        if (bar >= 12 && (stepInBar === 0 || stepInBar === 8) && rand() < 0.16) allowChord = true;
      } else {
        // Overdrive: denser 8ths + occasional 16th bursts + chords + holds
        if (stepInBar % 4 === 0) spawn = true;
        else if (stepInBar % 2 === 0) spawn = rand() < 0.72 * intensity;
        else spawn = rand() < 0.28 * intensity;
        if (bar >= 4 && (stepInBar === 0 || stepInBar === 8) && rand() < 0.22) isHold = true;
        if (bar >= 6 && stepInBar % 4 === 0 && rand() < 0.28) allowChord = true;
      }

      if (!spawn) continue;

      let lane = Math.floor(rand() * 4);
      if (lane === lastLane && rand() < 0.72) {
        lane = (lane + 1 + Math.floor(rand() * 3)) % 4;
      }
      lastLane = lane;

      const t = startTime + s * stepDuration;
      if (isHold && !allowChord) {
        const holdSteps = diff === 'overdrive' ? 4 : 4;
        const dur = holdSteps * stepDuration;
        generated.push({
          targetTime: t,
          endTime: t + dur,
          duration: dur,
          lane,
          type: 'hold',
          hit: false,
          holding: false,
          completed: false,
          missed: false,
          tickAcc: 0
        });
        holdCooldown = holdSteps + 1;
      } else {
        generated.push({
          targetTime: t,
          endTime: t,
          duration: 0,
          lane,
          type: 'tap',
          hit: false,
          holding: false,
          completed: false,
          missed: false
        });
        if (allowChord) {
          const lane2 = (lane + 1 + Math.floor(rand() * 3)) % 4;
          generated.push({
            targetTime: t,
            endTime: t,
            duration: 0,
            lane: lane2,
            type: 'tap',
            hit: false,
            holding: false,
            completed: false,
            missed: false
          });
        }
      }
    }

    songEndTime = startTime + (totalSteps + 6) * stepDuration;
    return generated;
  }

  function scheduleStep(step, time) {
    if (step >= totalSteps) return;
    const track = TRACKS[selectedTrackIdx];
    const bar = Math.floor(step / 16);
    const stepInBar = step % 16;
    const chordIdx = bar % track.chords.length;
    const chord = track.chords[chordIdx];
    const bassFreq = track.bassRoots[chordIdx];

    // Kick on 0, 4, 8, 12 (+ syncopation in rush/hyper)
    if (stepInBar % 4 === 0) {
      playKick(time);
      // Sync beat pulse closely
      const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
      setTimeout(() => { if (gameState === 'playing') beatPulse = 1; }, delayMs);
    }

    // Snare on 4 and 12 (beats 2 and 4)
    if (bar >= 1 && (stepInBar === 4 || stepInBar === 12)) {
      playSnare(time);
    }

    // Hats
    if (stepInBar % 2 === 0) {
      playHat(time, stepInBar === 14);
    } else if (bar >= 8 && track.bpm >= 120) {
      playHat(time, false);
    }

    // Driving 8th-note Synth Bass
    if (stepInBar % 2 === 0) {
      const oct = stepInBar % 4 === 2 ? 2 : 1;
      playBass(time, bassFreq * oct, stepDuration * 1.7);
    }

    // Arpeggio / Melody Lead
    if (bar >= 2 && stepInBar % 2 === 0) {
      const arpIdx = track.arpPattern[(stepInBar / 2) % track.arpPattern.length];
      const noteFreq = chord[arpIdx] * (bar % 8 >= 4 ? 2 : 1);
      playLead(time, noteFreq, stepDuration * 1.9, bar >= 4 ? 0.13 : 0.08);
    }
  }

  function runScheduler() {
    if (gameState !== 'playing') return;
    const lookahead = 0.12;
    while (nextStepTime < audioCtx.currentTime + lookahead && currentStep < totalSteps) {
      scheduleStep(currentStep, nextStepTime);
      nextStepTime += stepDuration;
      currentStep++;
    }
  }

  function startGame() {
    initAudio();
    const track = TRACKS[selectedTrackIdx];

    score = 0;
    combo = 0;
    maxCombo = 0;
    counts = { perfect: 0, great: 0, good: 0, miss: 0 };
    bossLevel = 1;
    bossMaxHP = 120;
    bossHP = bossMaxHP;
    bossHitFlash = 0;
    bossBreakTimer = 0;
    particles = [];
    lasers = [];
    floatingTexts = [];
    lanePressed = [false, false, false, false];
    laneFlash = [0, 0, 0, 0];
    shakeAmount = 0;
    beatPulse = 0;

    songStartTime = audioCtx.currentTime + 0.15;
    nextStepTime = songStartTime;
    currentStep = 0;
    pausedAccum = 0;

    notes = buildChart(track, difficulty, songStartTime);

    menuOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    hudControls.classList.remove('hidden');

    gameState = 'playing';
    if (schedulerTimer) clearInterval(schedulerTimer);
    schedulerTimer = setInterval(runScheduler, 20);

    if (!rafId) rafId = requestAnimationFrame(loop);
  }

  function pauseGame() {
    if (gameState !== 'playing') return;
    gameState = 'paused';
    pauseStartTime = performance.now();
    if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
    if (schedulerTimer) clearInterval(schedulerTimer);
    pauseOverlay.classList.remove('hidden');
  }

  function resumeGame() {
    if (gameState !== 'paused') return;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    gameState = 'playing';
    pauseOverlay.classList.add('hidden');
    schedulerTimer = setInterval(runScheduler, 20);
  }

  function quitToMenu() {
    gameState = 'menu';
    if (schedulerTimer) clearInterval(schedulerTimer);
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    pauseOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    hudControls.classList.add('hidden');
    menuOverlay.classList.remove('hidden');
    renderTrackList();
  }

  function finishSong() {
    gameState = 'result';
    if (schedulerTimer) clearInterval(schedulerTimer);
    hudControls.classList.add('hidden');

    const totalNotes = counts.perfect + counts.great + counts.good + counts.miss;
    const weighted = counts.perfect * 1 + counts.great * 0.75 + counts.good * 0.45;
    const acc = totalNotes > 0 ? Math.round((weighted / totalNotes) * 1000) / 10 : 100;

    let rank = 'C';
    if (acc >= 96 && counts.miss === 0) rank = 'S+';
    else if (acc >= 92) rank = 'S';
    else if (acc >= 84) rank = 'A';
    else if (acc >= 72) rank = 'B';

    const track = TRACKS[selectedTrackIdx];
    const prevBest = loadBest(track.id, difficulty);
    const isNewBest = !prevBest || score > prevBest.score;
    if (isNewBest) {
      saveBest(track.id, difficulty, { score, rank, acc, maxCombo });
    }

    document.getElementById('resultTrackTitle').textContent = `${track.name} · ${difficulty.toUpperCase()}`;
    document.getElementById('resultRank').textContent = rank;
    document.getElementById('resultScore').textContent = score.toLocaleString();
    document.getElementById('newRecordBadge').classList.toggle('hidden', !isNewBest);
    document.getElementById('resAcc').textContent = acc.toFixed(1) + '%';
    document.getElementById('resCombo').textContent = maxCombo;
    document.getElementById('resBosses').textContent = (bossLevel - 1) + '기';
    document.getElementById('resBreakdown').textContent =
      `P ${counts.perfect} · G ${counts.great} · OK ${counts.good} · M ${counts.miss}`;

    resultOverlay.classList.remove('hidden');
  }

  // Hit detection
  function getPlayTime() {
    if (!audioCtx) return 0;
    return audioCtx.currentTime - (audioOffsetMs / 1000);
  }

  function triggerLaneDown(lane) {
    if (gameState !== 'playing') return;
    lanePressed[lane] = true;
    laneFlash[lane] = 1;

    const now = getPlayTime();
    let bestNote = null;
    let bestDiff = Infinity;

    for (let i = 0; i < notes.length; i++) {
      const n = notes[i];
      if (n.lane !== lane || n.hit || n.missed) continue;
      const d = Math.abs(n.targetTime - now);
      if (d < bestDiff) {
        bestDiff = d;
        bestNote = n;
      }
      if (n.targetTime - now > 0.25) break;
    }

    if (!bestNote || bestDiff > 0.165) return;

    let quality = 'good';
    let pts = 100;
    let dmg = 4;
    let label = 'GOOD';
    let color = '#38bdf8';

    if (bestDiff <= 0.058) {
      quality = 'perfect';
      pts = 300;
      dmg = 8;
      label = 'PERFECT';
      color = '#ffbe0b';
    } else if (bestDiff <= 0.105) {
      quality = 'great';
      pts = 200;
      dmg = 6;
      label = 'GREAT';
      color = '#00f0ff';
    }

    bestNote.hit = true;
    if (bestNote.type === 'hold') {
      bestNote.holding = true;
    } else {
      bestNote.completed = true;
    }

    registerHit(quality, pts, dmg, label, color, lane);
  }

  function triggerLaneUp(lane) {
    lanePressed[lane] = false;
    if (gameState !== 'playing') return;
    const now = getPlayTime();
    for (let i = 0; i < notes.length; i++) {
      const n = notes[i];
      if (n.lane === lane && n.type === 'hold' && n.holding && !n.completed) {
        n.holding = false;
        n.completed = true;
        // Forgiving release window
        if (n.endTime - now <= 0.16) {
          registerHit('perfect', 250, 7, 'HOLD CLEAR!', '#ffbe0b', lane);
        }
      }
    }
  }

  function registerHit(quality, basePts, baseDmg, label, color, lane) {
    counts[quality]++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;

    const fever = combo >= 25;
    const mult = fever ? 4 : (combo >= 15 ? 3 : (combo >= 5 ? 2 : 1));
    score += basePts * mult;

    const dmg = baseDmg * (fever ? 2 : 1);
    bossHP -= dmg;
    bossHitFlash = 1;
    if (quality === 'perfect') shakeAmount = Math.max(shakeAmount, 3.5);

    playHitSFX(quality, lane);

    const lx = laneLeft + lane * laneW + laneW / 2;
    const bossX = W / 2;
    const bossY = arenaH * 0.56;

    // Laser beam from receptor to boss
    lasers.push({
      x1: lx, y1: hitY,
      x2: bossX + (Math.random() - 0.5) * 24, y2: bossY + (Math.random() - 0.5) * 18,
      color: LANE_COLORS[lane],
      life: 1
    });

    // Hit burst particles
    for (let i = 0; i < (quality === 'perfect' ? 12 : 7); i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 80 + Math.random() * 190;
      particles.push({
        x: lx, y: hitY,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        r: 2 + Math.random() * 3,
        color: LANE_COLORS[lane],
        life: 1
      });
    }

    floatingTexts.push({
      x: lx, y: hitY - 34,
      text: label,
      color,
      life: 1
    });

    if (bossHP <= 0) {
      bossLevel++;
      bossMaxHP = Math.round(120 + (bossLevel - 1) * 55);
      bossHP = bossMaxHP;
      bossBreakTimer = 1.2;
      score += 2000;
      shakeAmount = 10;
      playBossBreakSFX();

      for (let i = 0; i < 36; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 120 + Math.random() * 280;
        particles.push({
          x: bossX, y: bossY,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          r: 3 + Math.random() * 4,
          color: LANE_COLORS[i % 4],
          life: 1.2
        });
      }
      floatingTexts.push({
        x: bossX, y: bossY - 36,
        text: 'BOSS BREAK! +2000',
        color: '#ffbe0b',
        life: 1.4
      });
    }
  }

  // Input listeners: Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Escape' && (gameState === 'playing' || gameState === 'paused')) {
      gameState === 'playing' ? pauseGame() : resumeGame();
      return;
    }
    const lane = KEY_MAP[e.code];
    if (lane !== undefined && gameState === 'playing') {
      e.preventDefault();
      triggerLaneDown(lane);
    }
  });
  window.addEventListener('keyup', (e) => {
    const lane = KEY_MAP[e.code];
    if (lane !== undefined) {
      triggerLaneUp(lane);
    }
  });

  // Input listeners: Multi-touch on Canvas
  function laneFromClientX(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const idx = Math.floor((x - laneLeft) / laneW);
    if (idx < 0) return 0;
    if (idx > 3) return 3;
    return idx;
  }

  canvas.addEventListener('touchstart', (e) => {
    if (gameState !== 'playing') return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const lane = laneFromClientX(t.clientX);
      activeTouches.set(t.identifier, lane);
      triggerLaneDown(lane);
    }
  }, { passive: false });

  function handleTouchEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (activeTouches.has(t.identifier)) {
        const lane = activeTouches.get(t.identifier);
        activeTouches.delete(t.identifier);
        triggerLaneUp(lane);
      }
    }
  }
  canvas.addEventListener('touchend', handleTouchEnd);
  canvas.addEventListener('touchcancel', handleTouchEnd);

  // Mouse fallback for desktop click
  let mouseLane = -1;
  canvas.addEventListener('mousedown', (e) => {
    if (gameState !== 'playing') return;
    mouseLane = laneFromClientX(e.clientX);
    triggerLaneDown(mouseLane);
  });
  window.addEventListener('mouseup', () => {
    if (mouseLane !== -1) {
      triggerLaneUp(mouseLane);
      mouseLane = -1;
    }
  });

  // Buttons
  startBtn.onclick = startGame;
  pauseBtn.onclick = pauseGame;
  resumeBtn.onclick = resumeGame;
  restartBtn.onclick = startGame;
  quitBtn.onclick = quitToMenu;
  resMenuBtn.onclick = quitToMenu;
  resRetryBtn.onclick = startGame;

  muteBtn.onclick = () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (masterGain && audioCtx) {
      masterGain.gain.setValueAtTime(muted ? 0 : 0.72, audioCtx.currentTime);
    }
  };

  // Main Animation Loop
  let lastFrameTime = performance.now();
  function loop(nowMs) {
    rafId = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (nowMs - lastFrameTime) / 1000);
    lastFrameTime = nowMs;

    update(dt);
    draw();
  }

  function update(dt) {
    beatPulse = Math.max(0, beatPulse - dt * 4.5);
    shakeAmount = Math.max(0, shakeAmount - dt * 28);
    bossHitFlash = Math.max(0, bossHitFlash - dt * 6);
    bossBreakTimer = Math.max(0, bossBreakTimer - dt);

    for (let i = 0; i < 4; i++) {
      laneFlash[i] = Math.max(0, laneFlash[i] - dt * 5);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 2.1;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = lasers.length - 1; i >= 0; i--) {
      lasers[i].life -= dt * 5.5;
      if (lasers[i].life <= 0) lasers.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const f = floatingTexts[i];
      f.y -= dt * 42;
      f.life -= dt * 1.9;
      if (f.life <= 0) floatingTexts.splice(i, 1);
    }

    if (gameState !== 'playing') return;

    const now = getPlayTime();
    for (let i = 0; i < notes.length; i++) {
      const n = notes[i];
      // Hold note ticks
      if (n.type === 'hold' && n.holding && !n.completed) {
        n.tickAcc += dt;
        if (n.tickAcc >= 0.08) {
          n.tickAcc = 0;
          score += 35 * (combo >= 25 ? 4 : 1);
          bossHP -= 1.2;
          bossHitFlash = 0.5;
          const lx = laneLeft + n.lane * laneW + laneW / 2;
          particles.push({
            x: lx + (Math.random() - 0.5) * 14, y: hitY,
            vx: (Math.random() - 0.5) * 90, vy: -90 - Math.random() * 90,
            r: 2.5, color: LANE_COLORS[n.lane], life: 0.7
          });
        }
        if (now >= n.endTime) {
          n.holding = false;
          n.completed = true;
          registerHit('perfect', 250, 7, 'HOLD CLEAR!', '#ffbe0b', n.lane);
        }
      }

      // Miss check
      if (!n.hit && !n.missed && now - n.targetTime > 0.165) {
        n.missed = true;
        counts.miss++;
        combo = 0;
        floatingTexts.push({
          x: laneLeft + n.lane * laneW + laneW / 2,
          y: hitY - 26,
          text: 'MISS',
          color: '#ef4444',
          life: 0.85
        });
      }
    }

    if (now >= songEndTime) {
      finishSong();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();

    if (shakeAmount > 0.2) {
      ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
    }

    const fever = combo >= 25;

    // Background perspective grid pulse
    ctx.strokeStyle = fever
      ? `rgba(255, 190, 11, ${0.12 + beatPulse * 0.14})`
      : `rgba(0, 240, 255, ${0.07 + beatPulse * 0.1})`;
    ctx.lineWidth = 1;
    for (let y = arenaH; y < H; y += 44) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // Lanes background & dividers
    for (let l = 0; l < 4; l++) {
      const x = laneLeft + l * laneW;
      // Lane press beam
      if (lanePressed[l] || laneFlash[l] > 0) {
        const alpha = lanePressed[l] ? 0.22 : laneFlash[l] * 0.18;
        const grad = ctx.createLinearGradient(x, arenaH, x, hitY + 40);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, hexAlpha(LANE_COLORS[l], alpha));
        ctx.fillStyle = grad;
        ctx.fillRect(x + 2, arenaH, laneW - 4, hitY + 40 - arenaH);
      }

      // Vertical separator
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
      ctx.beginPath();
      ctx.moveTo(x, arenaH);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(laneLeft + laneW * 4, arenaH);
    ctx.lineTo(laneLeft + laneW * 4, H);
    ctx.stroke();

    // Hit bar line
    ctx.strokeStyle = fever ? '#ffbe0b' : 'rgba(255, 255, 255, 0.35)';
    ctx.lineWidth = fever ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(laneLeft, hitY);
    ctx.lineTo(laneLeft + laneW * 4, hitY);
    ctx.stroke();

    // Receptors
    for (let l = 0; l < 4; l++) {
      const cx = laneLeft + l * laneW + laneW / 2;
      const r = Math.min(laneW * 0.34, 28);
      ctx.save();
      ctx.strokeStyle = LANE_COLORS[l];
      ctx.lineWidth = lanePressed[l] ? 4 : 2.5;
      ctx.fillStyle = lanePressed[l] ? hexAlpha(LANE_COLORS[l], 0.35) : 'rgba(10, 8, 24, 0.7)';
      ctx.beginPath();
      ctx.arc(cx, hitY, r * (lanePressed[l] ? 1.08 : 1), 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Key hint label
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '800 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(LANE_KEYS[l], cx, hitY + r + 18);
      ctx.restore();
    }

    // Draw Notes
    if (gameState === 'playing' || gameState === 'paused') {
      const track = TRACKS[selectedTrackIdx];
      const now = getPlayTime();
      const speed = track.scrollSpeed;

      for (let i = 0; i < notes.length; i++) {
        const n = notes[i];
        if (n.completed || (n.missed && now - n.targetTime > 0.35)) continue;

        const yHead = hitY - (n.targetTime - now) * speed;
        const yTail = n.type === 'hold' ? hitY - (n.endTime - now) * speed : yHead;

        if (yTail > H + 40 || yHead < arenaH - 40) continue;

        const cx = laneLeft + n.lane * laneW + laneW / 2;
        const col = LANE_COLORS[n.lane];
        const noteW = Math.min(laneW * 0.72, 68);
        const noteH = 18;

        // Hold body
        if (n.type === 'hold') {
          const clampedHead = n.holding ? hitY : Math.min(hitY + 30, yHead);
          const topY = Math.max(arenaH, yTail);
          if (clampedHead > topY) {
            ctx.fillStyle = hexAlpha(col, n.holding ? 0.65 : 0.38);
            ctx.fillRect(cx - noteW * 0.28, topY, noteW * 0.56, clampedHead - topY);
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - noteW * 0.28, topY, noteW * 0.56, clampedHead - topY);
          }
        }

        // Note head (if not already hit)
        if (!n.hit) {
          ctx.save();
          ctx.shadowColor = col;
          ctx.shadowBlur = 12;
          ctx.fillStyle = n.missed ? '#475569' : col;
          roundRect(ctx, cx - noteW / 2, yHead - noteH / 2, noteW, noteH, 9);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          roundRect(ctx, cx - noteW * 0.32, yHead - 3, noteW * 0.64, 6, 3);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    // Lasers
    for (let i = 0; i < lasers.length; i++) {
      const l = lasers[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, l.life);
      ctx.strokeStyle = l.color;
      ctx.lineWidth = 4 * l.life;
      ctx.shadowColor = l.color;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(l.x1, l.y1);
      ctx.lineTo(l.x2, l.y2);
      ctx.stroke();
      ctx.restore();
    }

    // Particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Top Boss Arena backdrop
    const arenaGrad = ctx.createLinearGradient(0, 0, 0, arenaH + 20);
    arenaGrad.addColorStop(0, '#09071a');
    arenaGrad.addColorStop(0.82, 'rgba(13, 10, 32, 0.94)');
    arenaGrad.addColorStop(1, 'rgba(13, 10, 32, 0)');
    ctx.fillStyle = arenaGrad;
    ctx.fillRect(0, 0, W, arenaH + 20);

    // Boss Core
    if (gameState === 'playing' || gameState === 'paused') {
      drawBoss(fever);
      drawHUD(fever);
    }

    // Floating Judgments
    for (let i = 0; i < floatingTexts.length; i++) {
      const f = floatingTexts[i];
      ctx.save();
      ctx.globalAlpha = Math.min(1, f.life * 1.3);
      ctx.fillStyle = f.color;
      ctx.font = '900 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 8;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }

    // Fever border glow
    if (fever && gameState === 'playing') {
      ctx.strokeStyle = `rgba(255, 190, 11, ${0.35 + beatPulse * 0.4})`;
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, W - 4, H - 4);
    }

    ctx.restore();
  }

  function drawBoss(fever) {
    const cx = W / 2;
    const cy = arenaH * 0.57;
    const baseR = 28 + beatPulse * 6;
    const bossCol = bossHitFlash > 0.2 ? '#ffffff' : LANE_COLORS[(bossLevel - 1) % 4];

    ctx.save();
    // Outer rotating ring
    const t = performance.now() / 1000;
    ctx.translate(cx, cy);
    ctx.rotate(t * (fever ? 1.8 : 0.9));
    ctx.strokeStyle = hexAlpha(bossCol, 0.55);
    ctx.lineWidth = 2.5;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, baseR + 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Inner polygon core
    ctx.rotate(-t * 2.1);
    const sides = Math.min(8, 4 + bossLevel);
    ctx.fillStyle = bossHitFlash > 0.2 ? '#ffffff' : hexAlpha(bossCol, 0.25);
    ctx.strokeStyle = bossCol;
    ctx.lineWidth = 3;
    ctx.shadowColor = bossCol;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const ang = (i / sides) * Math.PI * 2;
      const px = Math.cos(ang) * baseR;
      const py = Math.sin(ang) * baseR;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Boss Name & HP Bar
    const barW = Math.min(260, W * 0.62);
    const barX = cx - barW / 2;
    const barY = arenaH - 22;
    const pct = Math.max(0, bossHP / bossMaxHP);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    roundRect(ctx, barX, barY, barW, 8, 4);
    ctx.fill();

    ctx.fillStyle = bossCol;
    roundRect(ctx, barX, barY, barW * pct, 8, 4);
    ctx.fill();

    const bossTitle = BOSS_NAMES[(bossLevel - 1) % BOSS_NAMES.length] + ` LV.${bossLevel}`;
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '800 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(bossTitle, cx, barY - 6);
  }

  function drawHUD(fever) {
    // Score top-left
    ctx.textAlign = 'left';
    ctx.fillStyle = '#94a3b8';
    ctx.font = '700 11px sans-serif';
    ctx.fillText('SCORE', 14, 22);
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 22px sans-serif';
    ctx.fillText(score.toLocaleString(), 14, 45);

    // Song progress line at very top
    const now = getPlayTime();
    const prog = Math.max(0, Math.min(1, (now - songStartTime) / Math.max(1, songEndTime - songStartTime)));
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(0, 0, W, 3);
    ctx.fillStyle = fever ? '#ffbe0b' : '#00f0ff';
    ctx.fillRect(0, 0, W * prog, 3);

    // Combo center
    if (combo >= 2) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = fever ? '#ffbe0b' : '#00f0ff';
      ctx.font = `900 ${fever ? 38 : 32}px sans-serif`;
      ctx.shadowColor = fever ? '#ffbe0b' : '#00f0ff';
      ctx.shadowBlur = 12;
      ctx.fillText(String(combo), W / 2, arenaH + 54);
      ctx.font = '800 11px sans-serif';
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText(fever ? '🔥 OVERDRIVE x4' : 'COMBO', W / 2, arenaH + 72);
      ctx.restore();
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function hexAlpha(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
